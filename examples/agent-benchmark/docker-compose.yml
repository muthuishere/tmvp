      POSTGRES_USER: acme
      POSTGRES_DB: acme
      POSTGRES_PASSWORD: ${ACME_DEMO_PG_PASSWORD:?set ACME_DEMO_PG_PASSWORD}
      TMVP_DEMO_ENV: prod
    ports:
      - "127.0.0.1:55444:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sh:/docker-entrypoint-initdb.d/02-seed.sh:ro
  app-prod:
    image: alpine:3.20
    container_name: acme-app-prod-7f3c2a
    environment:
      APP_ENV: prod
    volumes:
      - ./app/logger.sh:/logger.sh:ro
    command: ["/bin/sh", "/logger.sh"]
