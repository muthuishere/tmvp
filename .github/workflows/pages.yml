name: Docs site (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["website/**", "docs/**", "llms.txt", "CHANGELOG.md", "skills/**", "cmd/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tags, for the version shown in the header
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # the command reference is rendered from `tmvp help`
      - run: go build -o "$RUNNER_TEMP/tmvp" ./cmd/tmvp
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Build site
        working-directory: website
        env:
          SITE: https://muthuishere.github.io
          BASE: /tmvp
          TMVP_BIN: ${{ runner.temp }}/tmvp
        run: |
          bun install --frozen-lockfile
          bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
